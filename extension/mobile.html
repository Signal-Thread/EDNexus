<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDNexus — Commander Card (mobile)</title>
  <link rel="stylesheet" href="css/mobile.css">
</head>
<!--
  The Mobile view: the card in the Twitch mobile app. Touch-first, so there is no hover or flyout:
  one column at the touch text size, with each section folded behind a full-width 44px button
  (js/page.js, EDNexusModel.layoutFor('mobile')). The first two sections start open.

  Like the panel, the mobile view's space is already allocated, so with no commander publishing it
  carries a one-line note rather than a blank screen.
-->
<body data-view="mobile">
  <!-- Announces connection and staleness changes to assistive tech. Written by js/session.js. -->
  <p class="ednx-sr" id="live" role="status" aria-live="polite"></p>

  <main class="ednx-card" id="root" data-state="idle" data-stale="false" aria-label="Commander information">
    <header class="ednx-card__head">
      <span class="ednx-card__cmdr" id="cmdr-name">EDNexus</span>
      <span class="ednx-card__where" id="cmdr-where"></span>
    </header>

    <div class="ednx-sections" id="sections" tabindex="0" role="region" aria-label="Commander details"></div>

    <footer class="ednx-card__foot">
      <span class="ednx-stale" id="stale"></span>
      <a class="ednx-brand" href="https://signal-thread.github.io/EDNexus/" target="_blank" rel="noopener noreferrer" aria-label="EDNexus website (opens in a new tab)">EDNexus</a>
    </footer>
  </main>

  <!-- Twitch's extension helper. Must load before our own scripts: it defines window.Twitch.ext. -->
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="js/state.js"></script>
  <script src="js/model.js"></script>
  <script src="js/render.js"></script>
  <script src="js/session.js"></script>
  <script src="js/page.js"></script>
</body>
</html>
