name: EBS Worker

# Tests the Twitch Extension Backend Service Cloudflare Worker (ebs-worker/) on every change and deploys
# it from main.
#
# Deploying needs three repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN         API token allowed to edit Workers scripts and D1 databases
#   CLOUDFLARE_ACCOUNT_ID        your Cloudflare account ID
#   CLOUDFLARE_D1_DATABASE_ID    the database_id printed by `wrangler d1 create ednexus-ebs`
#
# The IDs are kept as secrets on purpose: this repository is public and ebs-worker/wrangler.jsonc is
# gitignored, so this workflow builds it from ebs-worker/wrangler.example.jsonc at deploy time. A fork
# without these secrets still runs the tests and simply skips the deploy. The Worker's runtime secrets
# (TWITCH_CLIENT_SECRET, ...) are set once with `wrangler secret put` and persist across deploys, so they
# are not handled here. See ebs-worker/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'ebs-worker/**'
      - '.github/workflows/ebs-worker.yml'
  pull_request:
    paths:
      - 'ebs-worker/**'
      - '.github/workflows/ebs-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ebs-worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ebs-worker/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Proves the Worker bundles and the config is valid, without touching Cloudflare. The placeholder
      # database id is fine because a dry run never contacts the account.
      - name: Bundle (dry run)
        run: |
          cp wrangler.example.jsonc wrangler.jsonc
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/ebs-worker-dry-run"

  deploy:
    needs: test
    # Pull requests only test. Deploys come from main, or when someone runs the workflow by hand on main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Never run two deploys (or migrations) at once, and let a running one finish instead of cancelling it.
    concurrency:
      group: ebs-worker-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - name: Check Cloudflare secrets are configured
        id: cf
        shell: bash
        # Runs before checkout, so the default working directory (ebs-worker/) does not exist yet.
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$D1_DATABASE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_D1_DATABASE_ID is not set, so the deploy was skipped."
          fi

      - if: steps.cf.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.cf.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ebs-worker/package-lock.json

      - name: Install dependencies
        if: steps.cf.outputs.configured == 'true'
        run: npm ci

      - name: Create wrangler.jsonc from the template
        if: steps.cf.outputs.configured == 'true'
        run: sed "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${D1_DATABASE_ID}/" wrangler.example.jsonc > wrangler.jsonc

      # Migrations go first so the new code never runs against an older schema.
      - name: Apply D1 migrations
        if: steps.cf.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply ednexus-ebs --remote

      - name: Deploy Worker
        if: steps.cf.outputs.configured == 'true'
        run: npx wrangler deploy
