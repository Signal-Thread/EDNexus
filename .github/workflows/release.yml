name: Release

on:
  push:
    tags: ['v*']            # e.g. git tag v0.1.0 && git push --tags
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0 (defaults to the tag)'
        required: false

# The Sentry DSN / auth token live ONLY in repo/org Actions secrets and are injected at build time —
# never committed. Configure at Settings → Secrets and variables → Actions:
#   SENTRY_DSN         (required to enable crash reporting in released builds)
#   SENTRY_AUTH_TOKEN  (optional; enables debug-symbol upload for readable stack traces)
# Least privilege by default; only the job that publishes the release is granted write access.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        # The dispatch input is attacker-influenced text: it is passed through env (never interpolated
        # into the script) and validated before it can reach any later step that holds secrets.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected e.g. 0.1.0 or 0.1.0-beta.1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Releases only ship from a commit whose tests pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test EDNexus.slnx --configuration Release

  windows:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        run: choco install innosetup --version=6.4.3 -y --no-progress
      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: ./installer/windows/build.ps1 -Version $env:VERSION
      # OPTIONAL Authenticode signing (not yet exercised; skipped unless the secrets below exist).
      # A checksum published beside the installer proves integrity only; a signature from a code-signing
      # certificate is what lets users (and a future updater check) trust who built it.
      #   WINDOWS_SIGNING_CERT_PFX_BASE64  base64 of the .pfx   WINDOWS_SIGNING_CERT_PASSWORD  its password
      - name: Sign installer (optional)
        shell: pwsh
        env:
          SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERT) { Write-Host "No signing certificate configured; installer left unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          try {
            Get-ChildItem installer/windows/out/*.exe | ForEach-Object {
              & $signtool.FullName sign /f $pfx /p $env:SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
            }
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: installer/windows/out/*.exe

  linux:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      # Produces the self-contained payload tarball (for Flathub) and a standalone .flatpak
      # bundle users can sideload from the Release.
      - name: Build Flatpak bundle + payload
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x packaging/flatpak/build-flatpak.sh
          ./packaging/flatpak/build-flatpak.sh "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-flatpak
          path: |
            packaging/flatpak/out/*.flatpak
            packaging/flatpak/out/*.tar.gz

  release:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Generate checksums
        # AutoUpdateService verifies a downloaded asset against a "<asset>.sha256" sidecar
        # when one is present in the release; without this step there was nothing to check
        # against, so verification always silently no-opped.
        run: |
          find artifacts -type f ! -name '*.sha256' -print0 | while IFS= read -r -d '' f; do
            sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
          done
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/**/*
          generate_release_notes: true
