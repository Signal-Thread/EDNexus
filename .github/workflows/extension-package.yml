name: Twitch extension bundle

# Packages extension/ into the zip Twitch accepts as an extension's hosted asset bundle, so the
# upload is a download-and-drop rather than a local zip someone has to remember the rules for.
#
# Twitch serves the archive's contents directly under the extension's Base URI, so the files must sit
# at the ROOT of the zip — a wrapping folder would make every viewer path 404.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'extension/**'
      - '.github/workflows/extension-package.yml'
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/extension-package.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    # Read-only: this job also runs for pull requests, including ones from forks.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the transport logic
        run: node extension/dev/test-state.js

      - name: Check the views (what each shows, and that every entry page is wired up)
        run: node extension/dev/test-views.js

      - name: Stage the files Twitch serves
        run: |
          mkdir -p bundle
          # dev/ is the local harness — an HTTPS server and a sample payload. Shipping it would
          # publish a mock-data path to viewers.
          rsync -a --exclude 'dev/' --exclude 'README.md' extension/ bundle/
          echo "Bundle contents:"
          find bundle -type f | sort | sed 's/^/  /'

      - name: Check the bundle is what Twitch expects
        run: |
          fail=0

          # Paths configured in the developer console, resolved against the Base URI.
          views="video_overlay.html panel.html component.html mobile.html config.html"
          scripts="js/state.js js/model.js js/render.js js/session.js js/card.js js/page.js js/component.js js/config.js"
          styles="css/tokens.css css/sections.css css/card.css css/page.css css/mobile.css css/component.css css/config.css"
          for required in $views $scripts $styles; do
            if [ ! -f "bundle/$required" ]; then
              echo "::error::missing from the bundle: $required"
              fail=1
            fi
          done

          # The local harness must never reach viewers.
          if [ -e bundle/dev ]; then
            echo "::error::dev/ was included; it is the local mock-data harness"
            fail=1
          fi

          # Every view needs Twitch's helper or window.Twitch.ext never exists and the view is inert.
          for view in $views; do
            if ! grep -q 'twitch-ext.min.js' "bundle/$view"; then
              echo "::error::$view does not load the Twitch helper script"
              fail=1
            fi
          done

          # Twitch's extension CSP rejects inline script and style. Cheap to catch here, slow in review.
          if grep -nP '<script(?![^>]*\bsrc=)|<style|\sstyle=' bundle/*.html; then
            echo "::error::inline script or style in a view (see the lines above)"
            fail=1
          fi

          # The only link out of the extension is the EDNexus mark, to the project site: opened in a new
          # tab, with noopener noreferrer so it neither replaces the extension frame nor passes the
          # channel page along. Any other <a>, or a target= on anything else, is a mistake. Keep each
          # <a ...> tag on one line: this check reads it that way.
          site="https://signal-thread.github.io/EDNexus/"
          if grep -nP '\starget=' bundle/*.html | grep -vP '<a\s[^>]*\btarget="_blank"'; then
            echo "::error::target= on something other than a link (see the lines above)"
            fail=1
          fi
          while IFS= read -r tag; do
            for need in "href=\"$site\"" 'target="_blank"' 'rel="noopener noreferrer"'; do
              case "$tag" in
                *"$need"*) ;;
                *) echo "::error::a link out of the extension is not allowed as written ($need missing): $tag"; fail=1 ;;
              esac
            done
          done < <(grep -ohP '<a\s[^>]*>' bundle/*.html || true)

          exit $fail

      - name: Zip it
        run: |
          # Zip the top-level entries by name rather than ".": Info-ZIP can record "." as a
          # "./" prefix on every path, and Twitch resolves viewer paths against the archive root.
          cd bundle && zip -r ../ednexus-twitch-extension.zip * && cd ..
          echo "Archive:"
          unzip -l ednexus-twitch-extension.zip | sed 's/^/  /'
          echo "Size: $(du -h ednexus-twitch-extension.zip | cut -f1)"

      - name: Confirm the views sit at the archive root
        run: |
          # A wrapping folder is the classic mistake and only shows up as 404s after upload.
          unzip -l ednexus-twitch-extension.zip | grep -qE ' video_overlay\.html$' \
            || { echo "::error::video_overlay.html is not at the root of the archive"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ednexus-twitch-extension
          path: ednexus-twitch-extension.zip
          if-no-files-found: error

  # The only job that can write to the repository, and it never runs for a pull request: it takes
  # the already-checked bundle and attaches it to the release for the tag.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ednexus-twitch-extension

      - name: Attach to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ednexus-twitch-extension.zip
