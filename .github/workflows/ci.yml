name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EDNexus.slnx

      - name: Build
        run: dotnet build EDNexus.slnx --configuration Release --no-restore

      # No SentryDsn / SENTRY_AUTH_TOKEN here, so this build embeds no DSN and uploads no symbols.
      - name: Test
        run: dotnet test EDNexus.slnx --configuration Release --no-build --verbosity normal
