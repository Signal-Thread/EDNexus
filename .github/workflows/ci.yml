name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EDNexus.slnx

      - name: Build
        run: dotnet build EDNexus.slnx --configuration Release --no-restore

      # No SentryDsn / SENTRY_AUTH_TOKEN here, so this build embeds no DSN and uploads no symbols.
      - name: Test
        run: dotnet test EDNexus.slnx --configuration Release --no-build --verbosity normal
