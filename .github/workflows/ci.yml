name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      # Let both legs finish so a Windows-only failure doesn't hide the Linux result (or the reverse).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EDNexus.slnx

      - name: Build
        run: dotnet build EDNexus.slnx --configuration Release --no-restore

      # No SentryDsn / SENTRY_AUTH_TOKEN here, so this build embeds no DSN and uploads no symbols.
      - name: Test
        run: dotnet test EDNexus.slnx --configuration Release --no-build --verbosity normal
